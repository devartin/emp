[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["devartin"]
repository = "https://github.com/devartin/emp"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
parking_lot = "0.12"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1"
emp-crypto = { path = "crates/emp-crypto" }
emp-store = { path = "crates/emp-store" }
emp-sheets = { path = "crates/emp-sheets" }
emp-finance = { path = "crates/emp-finance" }
emp-integrations = { path = "crates/emp-integrations" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "unwind"
strip = true
debug = false
incremental = false
overflow-checks = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
