[package]
name = "emp-app"
version.workspace = true
publish = false
description = "Ultranote — local-first, encrypted productivity super app"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "emp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }
serde_json.workspace = true

[dependencies]
tauri = { version = "2", features = ["isolation"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
uuid.workspace = true
chrono.workspace = true
zeroize.workspace = true
base64.workspace = true
sha2 = "0.10"
hex = "0.4"
url = "2"
idna = "1"
getrandom = "0.2"
# Already in the tree (chrono's `clock` feature / tauri): OS time zone for region detection, release version compare.
iana-time-zone = "0.1"
semver = "1"
emp-crypto.workspace = true
emp-store.workspace = true
emp-sheets.workspace = true
emp-finance.workspace = true
emp-integrations.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
# Already in the tree (tao / wry); used for NSWorkspace sleep / screen-lock observers (SPEC §9.9).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSDistributedNotificationCenter",
  "NSNotification",
  "NSOperation",
  "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
# Already in the tree (tao / core-foundation); CFRunLoop for the IOKit system power notification thread.
core-foundation-sys = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree (tauri plugins); used for logind sleep / screen-lock signals (SPEC §9.9).
zbus = "5"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
emp-crypto = { workspace = true, features = ["insecure-test-kdf"] }
tempfile = "3"
