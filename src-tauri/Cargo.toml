[package]
name = "emp-app"
version.workspace = true
description = "EMP — local-first, encrypted productivity super app"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "emp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }
serde_json.workspace = true

[dependencies]
tauri = { version = "2", features = ["isolation"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
uuid.workspace = true
chrono.workspace = true
zeroize.workspace = true
base64.workspace = true
sha2 = "0.10"
hex = "0.4"
url = "2"
idna = "1"
getrandom = "0.2"
emp-crypto.workspace = true
emp-store.workspace = true
emp-sheets.workspace = true
emp-finance.workspace = true
emp-integrations.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_Debug"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree (tauri plugins); used for logind sleep / screen-lock signals (SPEC §9.9).
zbus = "5"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
emp-crypto = { workspace = true, features = ["insecure-test-kdf"] }
tempfile = "3"
