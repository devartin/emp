<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMP · Kinetic precision</title>
<style>/* ═══════════════════════════════════════════════════════════════════════════
   EMP · Design language v2 · "Kinetic precision"
   Materials: slab (raised, has an edge), plate (card), groove (sunken), glass (overlay).
   Every state change is transform / opacity / filter. Shadows never animate —
   each state's shadow lives on its own pseudo-layer and we crossfade opacity.
   ═══════════════════════════════════════════════════════════════════════════ */
@font-face { font-family: "Inter Variable"; font-weight: 100 900; font-display: block;
  src: url("../../node_modules/@fontsource-variable/inter/files/inter-latin-opsz-normal.woff2") format("woff2-variations"); }
@font-face { font-family: "JetBrains Mono Variable"; font-weight: 100 900;
  src: url("../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations"); }

/* springs → CSS linear(); values injected at boot by kinetic.js (springToLinear) */
:root {
  --sp-tap: cubic-bezier(.2,0,0,1); --sp-tap-d: 260ms;
  --sp-glide: cubic-bezier(.16,1,.3,1); --sp-glide-d: 430ms;
  --sp-settle: cubic-bezier(.16,1,.3,1); --sp-settle-d: 500ms;
  --sp-pop: cubic-bezier(.34,1.56,.64,1); --sp-pop-d: 700ms;
  --sp-roll: cubic-bezier(.16,1,.3,1); --sp-roll-d: 585ms;
  --ease-out: cubic-bezier(.2,0,0,1);
  --ease-in: cubic-bezier(.4,0,1,1);
  --press-in: 70ms cubic-bezier(.3,0,.6,1);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #050506; font-family: "Inter Variable", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.num, .odo, .mono-num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "cv11" 1, "ss01" 1; }

/* ─────────────────────────── theme tokens ─────────────────────────── */
.theme {
  --font: "Inter Variable", Inter, system-ui, sans-serif;
  --mono: "JetBrains Mono Variable", ui-monospace, monospace;
  font-family: var(--font);
  font-size: 14px;
  color: var(--text);
  background: var(--win);
}
.theme[data-theme="light"] {
  color-scheme: light;
  --win: #ededf0;
  --canvas: #f6f6f8;
  --plate-top: #ffffff; --plate-bot: #fbfbfc;
  --plate-ring: rgba(16,16,24,.075);
  --plate-hl: rgba(255,255,255,1);
  --plate-shadow: 0 1px 1px rgba(16,16,24,.04), 0 2px 5px -2px rgba(16,16,24,.06), 0 10px 24px -14px rgba(16,16,24,.10);
  --plate-shadow-lift: 0 2px 4px -1px rgba(16,16,24,.06), 0 14px 28px -10px rgba(16,16,24,.18), 0 30px 60px -30px rgba(16,16,24,.20);
  --text: #131316; --text2: #52525b; --text3: #6e6e77; --text4: #9b9ba5;
  --hair: rgba(16,16,24,.07); --hair2: rgba(16,16,24,.12);
  --hover: rgba(16,16,24,.045); --press: rgba(16,16,24,.075);
  --groove-bg: #e9e9ed; --groove-in: inset 0 1px 2px rgba(16,16,24,.10), inset 0 0 0 1px rgba(16,16,24,.05); --groove-lip: 0 1px 0 rgba(255,255,255,.9);
  --control-bg: #ffffff;
  /* slab · primary = graphite top face (icon slab seen from above, inverted) */
  --p-face: linear-gradient(180deg, #45454d 0%, #26262c 46%, #17171a 100%);
  --p-hl: rgba(255,255,255,.22); --p-lo: rgba(0,0,0,.35); --p-ring: rgba(0,0,0,.55);
  --p-edge: linear-gradient(180deg, #0b0b0d, #000);
  --p-fg: #fafafa; --p-spec: rgba(255,255,255,.22);
  --p-cast: 0 6px 12px -4px rgba(16,16,24,.38), 0 2px 3px -1px rgba(16,16,24,.25);
  /* slab · secondary = paper */
  --s-face: linear-gradient(180deg, #ffffff 0%, #fbfbfc 60%, #f2f2f5 100%);
  --s-hl: #ffffff; --s-lo: rgba(16,16,24,.05); --s-ring: rgba(16,16,24,.12);
  --s-edge: linear-gradient(180deg, #d5d5dc, #c4c4cc);
  --s-fg: #131316; --s-spec: rgba(255,255,255,.9);
  --s-cast: 0 4px 8px -3px rgba(16,16,24,.14), 0 1px 2px rgba(16,16,24,.08);
  /* slab · destructive */
  --d-face: linear-gradient(180deg, #ec5a5e 0%, #d83a3f 55%, #c22f34 100%);
  --d-hl: rgba(255,255,255,.28); --d-lo: rgba(0,0,0,.18); --d-ring: rgba(120,10,16,.55);
  --d-edge: linear-gradient(180deg, #8a1a1f, #5e0d11);
  --d-fg: #fff; --d-spec: rgba(255,255,255,.28);
  --d-cast: 0 6px 12px -4px rgba(190,30,40,.38);
  --ghost-plate: rgba(16,16,24,.055);
  --ring: #131316; --ring-soft: rgba(19,19,22,.14);
  --accent-solid: #18181b; --accent-fg: #fff;
  --accent-soft: rgba(16,16,24,.065);
  --gain: #0f9a4e; --gain-text: #0b7f45; --gain-soft: rgba(18,161,80,.1);
  --loss: #d93a3f; --loss-text: #c42f2b; --loss-soft: rgba(229,72,77,.1);
  --chart-line: #131316; --chart-area: rgba(19,19,22,.10); --chart-grid: rgba(16,16,24,.06);
  --glass: rgba(255,255,255,.82); --glass-ring: rgba(16,16,24,.08);
  --glass-shadow: 0 0 0 1px rgba(16,16,24,.07), 0 24px 48px -12px rgba(16,16,24,.24), 0 8px 16px -8px rgba(16,16,24,.10);
  --scrim: rgba(22,22,28,.16);
  --halo: radial-gradient(60% 70% at 30% 0%, rgba(120,128,170,.10), transparent 70%);
  --grain-o: .035;
  --sw-off: #e1e1e6; --sw-on: linear-gradient(180deg, #3a3a40, #16161a);
  --thumb: linear-gradient(180deg, #ffffff, #f0f0f3); --thumb-on: linear-gradient(180deg, #ffffff, #ececf0);
  --sel-plate: linear-gradient(180deg, #ffffff, #f7f7f9);
  --sel-ring: rgba(16,16,24,.09);
  --sel-shadow: 0 1px 2px rgba(16,16,24,.08), 0 2px 6px -3px rgba(16,16,24,.12);
  --tile-face: linear-gradient(160deg, #ffffff 0%, #ececf0 100%);
}
.theme[data-theme="dark"], .theme[data-theme="midnight"] {
  color-scheme: dark;
  --win: #08080a;
  --canvas: #0d0d10;
  --plate-top: #18181c; --plate-bot: #131316;
  --plate-ring: rgba(255,255,255,.065);
  --plate-hl: rgba(255,255,255,.06);
  --plate-shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 28px -14px rgba(0,0,0,.7);
  --plate-shadow-lift: 0 2px 4px rgba(0,0,0,.5), 0 22px 44px -16px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05);
  --text: #ededf0; --text2: #a3a3ad; --text3: #8b8b95; --text4: #5f5f69;
  --hair: rgba(255,255,255,.065); --hair2: rgba(255,255,255,.11);
  --hover: rgba(255,255,255,.05); --press: rgba(255,255,255,.085);
  --groove-bg: rgba(0,0,0,.35); --groove-in: inset 0 1px 2px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.04); --groove-lip: 0 1px 0 rgba(255,255,255,.05);
  --control-bg: rgba(0,0,0,.22);
  /* slab · primary = the icon's top slab: silver face, graphite edge */
  --p-face: linear-gradient(180deg, #ffffff 0%, #e8e8ee 52%, #c8c8d1 100%);
  --p-hl: #ffffff; --p-lo: rgba(0,0,0,.14); --p-ring: rgba(0,0,0,.65);
  --p-edge: linear-gradient(180deg, #7d7d87, #4a4a52);
  --p-fg: #0a0a0c; --p-spec: rgba(255,255,255,1);
  --p-cast: 0 8px 16px -6px rgba(0,0,0,.8), 0 2px 4px rgba(0,0,0,.5);
  --s-face: linear-gradient(180deg, #2d2d33 0%, #232328 55%, #1d1d21 100%);
  --s-hl: rgba(255,255,255,.10); --s-lo: rgba(0,0,0,.3); --s-ring: rgba(0,0,0,.7);
  --s-edge: linear-gradient(180deg, #0c0c0e, #040405);
  --s-fg: #ededf0; --s-spec: rgba(255,255,255,.10);
  --s-cast: 0 6px 12px -4px rgba(0,0,0,.7);
  --d-face: linear-gradient(180deg, #f2666a 0%, #e0484d 55%, #c93a3f 100%);
  --d-hl: rgba(255,255,255,.32); --d-lo: rgba(0,0,0,.2); --d-ring: rgba(0,0,0,.6);
  --d-edge: linear-gradient(180deg, #7c1519, #4a080b);
  --d-fg: #fff; --d-spec: rgba(255,255,255,.35);
  --d-cast: 0 8px 18px -6px rgba(230,60,66,.35), 0 2px 4px rgba(0,0,0,.5);
  --ghost-plate: rgba(255,255,255,.065);
  --ring: #ededf0; --ring-soft: rgba(237,237,240,.16);
  --accent-solid: #ededf0; --accent-fg: #09090b;
  --accent-soft: rgba(255,255,255,.08);
  --gain: #3dd68c; --gain-text: #3dd68c; --gain-soft: rgba(61,214,140,.13);
  --loss: #ff6b6b; --loss-text: #ff7b7b; --loss-soft: rgba(255,107,107,.13);
  --chart-line: #ededf0; --chart-area: rgba(237,237,240,.13); --chart-grid: rgba(255,255,255,.055);
  --glass: rgba(26,26,31,.78); --glass-ring: rgba(255,255,255,.09);
  --glass-shadow: 0 0 0 1px rgba(255,255,255,.08), inset 0 1px 0 rgba(255,255,255,.06), 0 32px 64px -16px rgba(0,0,0,.85), 0 12px 24px -12px rgba(0,0,0,.6);
  --scrim: rgba(0,0,0,.55);
  --halo: radial-gradient(55% 75% at 28% 0%, rgba(201,210,255,.075), transparent 70%);
  --grain-o: .05;
  --sw-off: rgba(255,255,255,.12); --sw-on: linear-gradient(180deg, #ffffff, #c9c9d1);
  --thumb: linear-gradient(180deg, #f4f4f6, #d3d3da); --thumb-on: linear-gradient(180deg, #2a2a30, #121215);
  --sel-plate: linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.05));
  --sel-ring: rgba(255,255,255,.07);
  --sel-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 1px 2px rgba(0,0,0,.5), 0 4px 10px -4px rgba(0,0,0,.6);
  --tile-face: linear-gradient(160deg, #3a3a41 0%, #1b1b1f 100%);
}
.theme[data-theme="midnight"] {
  --win: #000; --canvas: #000;
  --plate-top: #0d0d0f; --plate-bot: #08080a;
  --plate-ring: rgba(255,255,255,.075);
  --s-face: linear-gradient(180deg, #232327 0%, #19191c 55%, #131315 100%);
  --glass: rgba(16,16,19,.82);
  --halo: radial-gradient(55% 75% at 28% 0%, rgba(201,210,255,.06), transparent 70%);
}

/* ─────────────────────────── page chrome ─────────────────────────── */
.topbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 16px; padding: 14px 32px; background: rgba(5,5,6,.82); backdrop-filter: blur(16px); color: #ededf0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 13px; }
.topbar b { font-weight: 600; letter-spacing: -.01em; }
.topbar .sp { flex: 1; }
.topbar label { display: inline-flex; align-items: center; gap: 6px; color: #a3a3ad; cursor: pointer; }
.topbar button { background: #1d1d21; border: 1px solid rgba(255,255,255,.1); color: #ededf0; border-radius: 8px; height: 28px; padding: 0 10px; cursor: pointer; }
.panel { position: relative; padding: 40px 32px 56px; }
.panel-h { display: flex; align-items: baseline; gap: 14px; margin: 0 0 22px; }
.panel-h h2 { margin: 0; font-size: 22px; font-weight: 640; letter-spacing: -.02em; }
.panel-h span { color: var(--text3); font-size: 13px; }
.row-title { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); margin: 38px 0 14px; display: flex; gap: 10px; align-items: center; }
.row-title::after { content: ""; flex: 1; height: 1px; background: var(--hair); }

/* grain + halo shared by the app window and stages */
.grain::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: var(--grain-o);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); mix-blend-mode: overlay; }

/* ═════════════════════════ MATERIAL: plate (cards) ═════════════════════════ */
.plate { position: relative; border-radius: 14px; background: linear-gradient(180deg, var(--plate-top), var(--plate-bot));
  box-shadow: 0 0 0 1px var(--plate-ring), inset 0 1px 0 var(--plate-hl), var(--plate-shadow); }
.plate::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: var(--plate-shadow-lift); opacity: 0; transition: opacity 220ms var(--ease-out); z-index: -1; }
.plate.tilt { transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0px)); will-change: transform; cursor: pointer; isolation: isolate; }
.plate.tilt:hover::after, .plate.tilt.is-hover::after { opacity: 1; }
.plate .sheen { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 260ms var(--ease-out);
  background: radial-gradient(420px circle at var(--px, 50%) var(--py, 0%), rgba(255,255,255,.07), transparent 55%); }
.theme[data-theme="light"] .plate .sheen { background: radial-gradient(420px circle at var(--px, 50%) var(--py, 0%), rgba(255,255,255,.9), transparent 55%); mix-blend-mode: soft-light; }
.plate.tilt:hover .sheen, .plate.tilt.is-hover .sheen { opacity: 1; }

/* ═════════════════════════ MATERIAL: slab (buttons) ═════════════════════════
   .btn      → static hit area (never moves on press → no hover jitter). Magnet translates it.
   ::before  → the slab EDGE hanging --depth below the face (like the icon's side faces)
   ::after   → cast shadow; only opacity + translate animate
   .face     → the top face; hover lifts −1px (edge grows), press sinks +depth (edge vanishes)
   .face::after → cursor-tracked specular (opacity only; position via --px/--py)        */
.btn { --h: 32px; --r: 9px; --depth: 2px; --pad: 13px;
  --face: var(--s-face); --hl: var(--s-hl); --lo: var(--s-lo); --fring: var(--s-ring); --edge: var(--s-edge); --fg: var(--s-fg); --spec: var(--s-spec); --cast: var(--s-cast);
  position: relative; display: inline-flex; height: var(--h); padding: 0; border: 0; background: none; border-radius: var(--r); cursor: pointer;
  transform: translate3d(var(--mx, 0px), var(--my, 0px), 0); -webkit-tap-highlight-color: transparent; outline: none; isolation: isolate; vertical-align: top; }
.btn::before { content: ""; position: absolute; left: 0; right: 0; top: var(--depth); height: var(--h); border-radius: var(--r); background: var(--edge); z-index: -1;
  box-shadow: 0 0 0 1px var(--fring); transition: opacity 160ms var(--ease-out); }
.btn::after { content: ""; position: absolute; inset: 0; border-radius: var(--r); box-shadow: var(--cast); z-index: -2; opacity: .75;
  transform: translateY(var(--depth)); transition: opacity var(--sp-tap-d) var(--ease-out), transform var(--sp-tap-d) var(--sp-tap); }
.btn .face { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 100%; padding: 0 var(--pad); width: 100%;
  border-radius: var(--r); background: var(--face); color: var(--fg); font-size: 13.5px; font-weight: 560; letter-spacing: -.005em; white-space: nowrap;
  box-shadow: inset 0 1px 0 var(--hl), inset 0 -1px 0 var(--lo), 0 0 0 1px var(--fring);
  transition: transform var(--sp-tap-d) var(--sp-tap); isolation: isolate; overflow: hidden; }
.btn .face::before { content: ""; position: absolute; inset: 0; background: #000; opacity: 0; z-index: -1; transition: opacity 120ms var(--ease-out); }
.btn .face::after { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity 200ms var(--ease-out);
  background: radial-gradient(90px circle at var(--px, 50%) var(--py, -20%), var(--spec), transparent 70%); mix-blend-mode: soft-light; }
.btn svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
.btn[data-v="primary"] { --face: var(--p-face); --hl: var(--p-hl); --lo: var(--p-lo); --fring: var(--p-ring); --edge: var(--p-edge); --fg: var(--p-fg); --spec: var(--p-spec); --cast: var(--p-cast); }
.btn[data-v="destructive"] { --face: var(--d-face); --hl: var(--d-hl); --lo: var(--d-lo); --fring: var(--d-ring); --edge: var(--d-edge); --fg: var(--d-fg); --spec: var(--d-spec); --cast: var(--d-cast); }
.btn[data-v="primary"] .face::after, .btn[data-v="destructive"] .face::after { mix-blend-mode: overlay; }
.btn[data-v="ghost"] { --face: transparent; --hl: transparent; --lo: transparent; --fring: transparent; --fg: var(--text2); --depth: 0px; }
.btn[data-v="ghost"]::before, .btn[data-v="ghost"]::after { display: none; }
.btn[data-v="ghost"] .face::before { background: var(--ghost-plate); opacity: 0; transform: scale(.92); transition: opacity 140ms var(--ease-out), transform var(--sp-tap-d) var(--sp-tap); border-radius: inherit; }
.btn[data-size="sm"] { --h: 28px; --r: 8px; --pad: 10px; }
.btn[data-size="sm"] .face { font-size: 12.5px; gap: 5px; }
.btn[data-size="sm"] svg { width: 14px; height: 14px; }
.btn[data-size="lg"] { --h: 40px; --r: 11px; --pad: 18px; --depth: 3px; }
.btn[data-size="lg"] .face { font-size: 14.5px; font-weight: 600; }
.btn.icon .face { padding: 0; width: var(--h); }
.btn .kbd { font: 500 11px/1 var(--mono); padding: 3px 5px; border-radius: 5px; margin-right: -4px; background: rgba(127,127,140,.16); color: inherit; opacity: .7; }

/* hover — face lifts, edge grows, shadow deepens, specular wakes */
@media (hover: hover) {
  .btn:hover .face { transform: translateY(-1px); }
  .btn:hover::after { opacity: 1; transform: translateY(calc(var(--depth) + 1px)); }
  .btn:hover .face::after { opacity: 1; }
  .btn[data-v="ghost"]:hover .face { color: var(--text); transform: none; }
  .btn[data-v="ghost"]:hover .face::before { opacity: 1; transform: scale(1); }
}
.btn.is-hover .face { transform: translateY(-1px); }
.btn.is-hover::after { opacity: 1; transform: translateY(calc(var(--depth) + 1px)); }
.btn.is-hover .face::after { opacity: 1; }
.btn[data-v="ghost"].is-hover .face { color: var(--text); transform: none; }
.btn[data-v="ghost"].is-hover .face::before { opacity: 1; transform: scale(1); }
/* press — face sinks flush with its edge (70ms in), released with the tap spring */
.btn:active .face, .btn.is-press .face { transform: translateY(var(--depth)) scale(.985); transition: transform var(--press-in); }
.btn:active .face::before, .btn.is-press .face::before { opacity: .07; }
.btn:active::after, .btn.is-press::after { opacity: .25; transform: translateY(var(--depth)) scale(.98); transition: opacity 70ms, transform var(--press-in); }
.btn[data-v="ghost"]:active .face, .btn[data-v="ghost"].is-press .face { transform: scale(.96); color: var(--text); }
.btn[data-v="ghost"]:active .face::before, .btn[data-v="ghost"].is-press .face::before { opacity: 1; background: var(--press); transform: scale(1); }
.theme[data-theme="light"] .btn[data-v="primary"]:active .face::before, .theme[data-theme="light"] .btn[data-v="primary"].is-press .face::before { background: #000; opacity: .2; }
/* focus — ring lands from 6px out (outline-offset anim runs once per focus) */
.btn:focus-visible, .btn.is-focus { outline: 2px solid var(--ring); outline-offset: 3px; animation: focus-land 260ms var(--ease-out); }
.btn:focus-visible::before, .btn.is-focus::before { }
@keyframes focus-land { from { outline-offset: 7px; outline-color: transparent; } }
/* disabled — the slab is laid flat: edge & shadow gone, face desaturated */
.btn:disabled, .btn.is-disabled { cursor: not-allowed; }
.btn:disabled .face, .btn.is-disabled .face { opacity: .42; transform: translateY(calc(var(--depth) / 2)); filter: saturate(.4); }
.btn:disabled::before, .btn.is-disabled::before, .btn:disabled::after, .btn.is-disabled::after { opacity: 0; }

/* hover icon micro-animations (per glyph personality) */
.btn svg *, .nav svg *, .ic * { transform-box: fill-box; transform-origin: center; }
.ico-plus { transition: transform var(--sp-tap-d) var(--sp-tap); }
.btn:hover .ico-plus, .btn.is-hover .ico-plus { transform: rotate(90deg); }
.ico-arrow { transition: transform var(--sp-tap-d) var(--sp-tap); }
.btn:hover .ico-arrow, .btn.is-hover .ico-arrow, .link-arrow:hover .ico-arrow { transform: translateX(3px); }
.ico-trash .lid { transform-origin: 100% 100%; transition: transform var(--sp-tap-d) var(--sp-tap); }
.btn:hover .ico-trash .lid, .btn.is-hover .ico-trash .lid { transform: translate(1px, -2px) rotate(14deg); }
.btn:hover .ico-bell, .btn.is-hover .ico-bell { animation: bell 620ms var(--ease-out); transform-origin: 50% 8%; }
@keyframes bell { 20% { transform: rotate(16deg); } 40% { transform: rotate(-12deg); } 60% { transform: rotate(7deg); } 80% { transform: rotate(-3deg); } }
.btn:hover .ico-dl .arr, .btn.is-hover .ico-dl .arr { animation: bob 700ms var(--ease-out); }
@keyframes bob { 40% { transform: translateY(3px); } 70% { transform: translateY(-1px); } }
.ico-search { transition: transform var(--sp-tap-d) var(--sp-tap); }
.btn:hover .ico-search, .btn.is-hover .ico-search { transform: rotate(-14deg) scale(1.08); }
.ico-sparkle .s2 { transform-origin: center; transition: transform var(--sp-pop-d) var(--sp-pop), opacity 200ms; }
.btn:hover .ico-sparkle .s2, .btn.is-hover .ico-sparkle .s2 { transform: rotate(90deg) scale(1.25); }
.ico-sparkle .s1 { transform-origin: center; transition: transform var(--sp-tap-d) var(--sp-tap); }
.btn:hover .ico-sparkle .s1, .btn.is-hover .ico-sparkle .s1 { transform: scale(.88); }

/* ═════════════════════════ MATERIAL: groove (inputs, tracks) ═════════════════════════ */
.groove { background: var(--groove-bg); box-shadow: var(--groove-in), var(--groove-lip); }

/* switch */
.switch { position: relative; width: 38px; height: 22px; border-radius: 99px; border: 0; padding: 0; cursor: pointer; background: var(--sw-off); flex: none;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.18), inset 0 0 0 1px rgba(0,0,0,.04), var(--groove-lip); outline: none; }
.switch .on { position: absolute; inset: 0; border-radius: inherit; background: var(--sw-on); opacity: 0; transition: opacity 180ms var(--ease-out);
  box-shadow: inset 0 1px 2px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.25); }
.switch .thumb { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 99px; background: var(--thumb);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.08), 0 0 0 .5px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.22), 0 3px 6px -1px rgba(0,0,0,.25);
  transform: translateX(var(--tx, 0px)) scaleX(var(--sx, 1)); transform-origin: var(--to, left center);
  transition: transform var(--sp-pop-d) var(--sp-switch, var(--sp-pop)); }
.switch[aria-checked="true"] .on { opacity: 1; }
.switch[aria-checked="true"] .thumb { --tx: 16px; --to: right center; }
.theme:not([data-theme="light"]) .switch[aria-checked="true"] .thumb { background: var(--thumb-on); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 0 0 .5px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.5); }
.switch:active .thumb, .switch.is-press .thumb { --sx: 1.22; transition: transform 90ms var(--ease-out); }
.switch:focus-visible, .switch.is-focus { outline: 2px solid var(--ring); outline-offset: 3px; animation: focus-land 260ms var(--ease-out); }
.switch:disabled { opacity: .42; cursor: not-allowed; }

/* segmented — sunken groove + raised mini-slab indicator that squashes with velocity */
.seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: 32px; padding: 3px; border-radius: 10px; isolation: isolate; }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 0 14px; min-width: 52px; font-size: 12.5px; font-weight: 560; color: var(--text3); cursor: pointer; border-radius: 7px; transition: color 160ms var(--ease-out); outline: none; }
.seg button:hover { color: var(--text2); }
.seg button[aria-pressed="true"] { color: var(--text); }
.seg button:focus-visible { box-shadow: 0 0 0 2px var(--ring); }
.seg .ind { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; border-radius: 7px; background: var(--s-face);
  box-shadow: inset 0 1px 0 var(--s-hl), 0 0 0 1px var(--sel-ring), 0 1px 0 0 var(--s-ring), 0 2px 5px -2px rgba(0,0,0,.35);
  transform: translateX(var(--x, 3px)) scaleX(var(--sq, 1)); will-change: transform; }

/* tabs — hover plate follows lazily (glide), underline morphs (x + width as scaleX) */
.tabs { position: relative; display: flex; gap: 2px; box-shadow: inset 0 -1px 0 var(--hair); padding-bottom: 1px; }
.tabs button { position: relative; z-index: 1; height: 38px; padding: 0 12px; border: 0; background: none; color: var(--text3); font-size: 14px; font-weight: 540; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: color 160ms var(--ease-out); outline: none; }
.tabs button:hover { color: var(--text2); }
.tabs button[aria-selected="true"] { color: var(--text); }
.tabs .count { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 99px; background: var(--accent-soft); color: var(--text2); }
.tabs .hov { position: absolute; top: 4px; height: 30px; left: 0; width: 100px; border-radius: 7px; background: var(--hover); opacity: 0; transform-origin: left center; transition: opacity 160ms var(--ease-out); pointer-events: none; will-change: transform; }
.tabs .ul { position: absolute; bottom: 0; left: 0; height: 2px; width: 100px; border-radius: 2px; background: var(--text); transform-origin: left center; will-change: transform; }

/* checkbox */
.cb { display: inline-flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; cursor: pointer; font-size: 13.5px; color: var(--text); outline: none; }
.cb .box { position: relative; width: 18px; height: 18px; border-radius: 5px; background: var(--control-bg); flex: none;
  box-shadow: inset 0 0 0 1px var(--hair2), inset 0 1px 2px rgba(0,0,0,.08); transition: transform var(--sp-tap-d) var(--sp-tap); }
.cb .fill { position: absolute; inset: 0; border-radius: inherit; background: var(--p-face); box-shadow: inset 0 1px 0 var(--p-hl), 0 0 0 1px var(--p-ring), 0 1px 2px rgba(0,0,0,.3);
  opacity: 0; transform: scale(.4); transition: opacity 120ms var(--ease-out), transform var(--sp-pop-d) var(--sp-pop); }
.cb svg { position: absolute; inset: 0; width: 18px; height: 18px; fill: none; stroke: var(--p-fg); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.cb .tick, .cb .dash { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 90ms var(--ease-in); }
.cb[aria-checked="true"] .fill, .cb[aria-checked="mixed"] .fill { opacity: 1; transform: scale(1); }
.cb[aria-checked="true"] .tick { stroke-dashoffset: 0; transition: stroke-dashoffset 220ms cubic-bezier(.65,0,.35,1) 70ms; }
.cb[aria-checked="mixed"] .dash { stroke-dashoffset: 0; transition: stroke-dashoffset 180ms var(--ease-out) 60ms; }
.cb:active .box, .cb.is-press .box { transform: scale(.86); transition: transform var(--press-in); }
.cb:hover .box { box-shadow: inset 0 0 0 1px var(--text4), inset 0 1px 2px rgba(0,0,0,.08); }
.cb:focus-visible .box, .cb.is-focus .box { outline: 2px solid var(--ring); outline-offset: 2px; }
.cb .burst { position: absolute; inset: -9px; pointer-events: none; }
.cb .burst i { position: absolute; left: 50%; top: 50%; width: 2px; height: 5px; margin: -2.5px -1px; border-radius: 2px; background: var(--text); opacity: 0; transform: rotate(var(--a)) translateY(-8px) scaleY(.4); }
.cb.bursting .burst i { animation: burst 460ms var(--ease-out) both; }
@keyframes burst { 0% { opacity: 0; transform: rotate(var(--a)) translateY(-8px) scaleY(.3); } 25% { opacity: .85; } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-15px) scaleY(1); } }
.cb .cbl { transition: color 200ms; }
.cb.strike[aria-checked="true"] .cbl { color: var(--text3); }
.cb.strike .cbl { background: linear-gradient(currentColor, currentColor) 0 55% / 0% 1px no-repeat; transition: background-size 260ms cubic-bezier(.65,0,.35,1) 120ms, color 200ms; }
.cb.strike[aria-checked="true"] .cbl { background-size: 100% 1px; }

/* input / select trigger */
.field { position: relative; display: flex; align-items: center; height: 34px; border-radius: 9px; background: var(--control-bg); width: 260px;
  box-shadow: inset 0 0 0 1px var(--hair2), inset 0 1px 2px rgba(0,0,0,.07); isolation: isolate; }
.theme:not([data-theme="light"]) .field { box-shadow: inset 0 0 0 1px var(--hair2), inset 0 1px 2px rgba(0,0,0,.4); }
.field::after { content: ""; position: absolute; inset: -1px; border-radius: 10px; pointer-events: none; opacity: 0; transform: scale(1.04);
  box-shadow: 0 0 0 1px var(--ring), 0 0 0 4px var(--ring-soft); transition: opacity 140ms var(--ease-out), transform var(--sp-glide-d) var(--sp-glide); }
.field:focus-within::after, .field.is-focus::after { opacity: 1; transform: none; }
.field input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; padding: 0 12px; font: inherit; font-size: 13.5px; color: var(--text); }
.field input::placeholder { color: var(--text4); transition: transform 220ms var(--ease-out), opacity 220ms; }
.field input:focus::placeholder { transform: translateX(4px); opacity: .7; }
.field .lead { margin-left: 11px; color: var(--text3); width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; transition: transform var(--sp-pop-d) var(--sp-pop), color 160ms; }
.field:focus-within .lead, .field.is-focus .lead { transform: rotate(-12deg) scale(1.08); color: var(--text); }
.field.invalid::after { opacity: 1; transform: none; box-shadow: 0 0 0 1px var(--loss), 0 0 0 4px var(--loss-soft); }
.field.shake { animation: shake 420ms var(--ease-out); }
@keyframes shake { 15% { transform: translateX(-6px); } 30% { transform: translateX(5px); } 45% { transform: translateX(-4px); } 60% { transform: translateX(3px); } 75% { transform: translateX(-1px); } }
.field .suffix { margin-right: 10px; font-size: 12px; color: var(--text3); }
.err { margin-top: 6px; font-size: 12px; color: var(--loss-text); }

.select { position: relative; display: inline-block; }
.select .chev { transition: transform var(--sp-glide-d) var(--sp-glide); margin-left: 2px; margin-right: -3px; opacity: .6; }
.select[data-open] .chev, .select.is-open .chev { transform: rotate(180deg); }
.select .btn .face { justify-content: space-between; min-width: 176px; font-weight: 500; }
.menu { position: absolute; top: calc(100% + 8px); left: 0; min-width: 100%; padding: 5px; border-radius: 12px; z-index: 30;
  background: var(--glass); backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5); box-shadow: var(--glass-shadow);
  transform-origin: var(--ox, 20%) top; opacity: 0; transform: translateY(-6px) scale(.95); pointer-events: none;
  transition: opacity 110ms var(--ease-in), transform 160ms var(--ease-in); }
.select[data-open] .menu, .select.is-open .menu { opacity: 1; transform: none; pointer-events: auto; transition: opacity 140ms var(--ease-out), transform var(--sp-glide-d) var(--sp-glide); }
.menu .mi { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 9px; border-radius: 7px; font-size: 13px; color: var(--text); cursor: pointer; position: relative;
  opacity: 0; transform: translateY(-3px); transition: opacity 120ms, transform 160ms var(--ease-out), background-color 100ms; }
.select[data-open] .mi, .select.is-open .mi { opacity: 1; transform: none; transition-delay: calc(var(--i) * 18ms + 30ms); }
.menu .mi:hover, .menu .mi.hl { background: var(--hover); }
.menu .mi .ck { margin-left: auto; width: 14px; height: 14px; stroke: var(--text); fill: none; stroke-width: 2; }
.dot { width: 8px; height: 8px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }

/* chips */
.chip { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; border: 0; font-size: 12.5px; font-weight: 540; cursor: pointer;
  background: var(--s-face); color: var(--text2); box-shadow: inset 0 1px 0 var(--s-hl), 0 0 0 1px var(--sel-ring), 0 1px 0 var(--s-ring);
  transition: transform var(--sp-tap-d) var(--sp-tap), color 140ms, opacity 160ms; outline: none; }
.chip:hover, .chip.is-hover { transform: translateY(-1px); color: var(--text); }
.chip:active, .chip.is-press { transform: translateY(1px) scale(.97); transition: transform var(--press-in); }
.chip .pip { width: 0; overflow: hidden; display: inline-flex; margin-left: -6px; opacity: 0; transform: scale(.3); transition: transform var(--sp-pop-d) var(--sp-pop), opacity 120ms; }
.chip[aria-pressed="true"] { background: var(--p-face); color: var(--p-fg); box-shadow: inset 0 1px 0 var(--p-hl), 0 0 0 1px var(--p-ring), 0 1px 0 rgba(0,0,0,.4); }
.chip[aria-pressed="true"] .pip { width: auto; margin-left: -2px; opacity: 1; transform: none; }
.chip svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chip .x { margin-right: -4px; width: 16px; height: 16px; display: inline-grid; place-items: center; border-radius: 99px; transition: transform var(--sp-tap-d) var(--sp-tap), background-color 120ms; }
.chip .x:hover { background: var(--press); transform: rotate(90deg); }
.chip.leaving { opacity: 0; transform: scale(.7); transition: opacity 160ms var(--ease-in), transform 200ms var(--ease-in); }
.chip:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

/* ═════════════════════════ app window ═════════════════════════ */
.appwin { position: relative; display: grid; grid-template-columns: 236px 1fr; height: 596px; border-radius: 16px; overflow: hidden; background: var(--canvas); isolation: isolate;
  box-shadow: 0 0 0 1px var(--plate-ring), 0 40px 80px -30px rgba(0,0,0,.55); }

.side { position: relative; z-index: 1; display: flex; flex-direction: column; padding: 12px 10px; background: var(--win); box-shadow: inset -1px 0 0 var(--hair); }
.ws { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 6px; margin-bottom: 8px; font-weight: 620; font-size: 14px; letter-spacing: -.01em; }
.ws .logo { width: 26px; height: 26px; border-radius: 7px; flex: none; display: block; box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 2px 4px rgba(0,0,0,.35); }

.nav .it { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 8px; border-radius: 8px; color: var(--text2); font-size: 13.5px; font-weight: 500; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; outline: none; transition: color 140ms; }
.nav .it:hover { color: var(--text); }
.nav .it[aria-current="page"] { color: var(--text); }
.nav .it:focus-visible { box-shadow: inset 0 0 0 2px var(--ring); }
.nav .it svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
.nav .it .kbd { margin-left: auto; font: 500 10.5px/1 var(--mono); color: var(--text4); padding: 3px 5px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--hair2); }
.nav .sel { position: absolute; left: 0; right: 0; top: 0; height: 30px; border-radius: 8px; background: var(--sel-plate); box-shadow: 0 0 0 1px var(--sel-ring), var(--sel-shadow); transform: translateY(var(--y, 0px)) scaleY(var(--sq, 1)); will-change: transform; z-index: 0; }
.nav .ghost { position: absolute; left: 0; right: 0; top: 0; height: 30px; border-radius: 8px; background: var(--hover); opacity: 0; transform: translateY(var(--y, 0px)); transition: opacity 180ms var(--ease-out); z-index: 0; pointer-events: none; }
.nav-h { font-size: 11px; font-weight: 600; color: var(--text4); letter-spacing: .02em; padding: 16px 8px 6px; }
.tile { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; flex: none; background: var(--tile-face); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 0 0 1px rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.25); }
.tile svg { width: 11px !important; height: 11px !important; stroke-width: 2.2 !important; }

.tile.c-amber { background: linear-gradient(160deg, #ffc65c, #d98a0b); color: #2a1a00; }

.tile.c-rose { background: linear-gradient(160deg, #ff7a88, #cc3344); color: #fff; }
.side .foot { margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text3); padding: 8px; }
.side .foot .led { width: 7px; height: 7px; border-radius: 99px; background: var(--gain); box-shadow: 0 0 0 3px var(--gain-soft); animation: led 2.4s ease-in-out infinite; }
@keyframes led { 50% { box-shadow: 0 0 0 5px transparent; } }
/* nav icon hover micro-animations */
.nav .it:hover .ic-home .roof { animation: roof 520ms var(--ease-out); }
@keyframes roof { 35% { transform: translateY(-2px); } 70% { transform: translateY(.5px); } }
.nav .it:hover .ic-cal .pg { animation: flip 520ms var(--ease-out); transform-origin: 50% 0; }
@keyframes flip { 40% { transform: scaleY(.6) translateY(1px); } }
.nav .it .ic-mk .b { transform-origin: 50% 100%; transition: transform 300ms var(--sp-pop); }
.nav .it:hover .ic-mk .b1 { transform: scaleY(1.45); } .nav .it:hover .ic-mk .b2 { transform: scaleY(.6); transition-delay: 30ms; } .nav .it:hover .ic-mk .b3 { transform: scaleY(1.25); transition-delay: 60ms; }
.nav .it .ic-gear { transition: transform var(--sp-settle-d) var(--sp-pop); }

.nav .it:hover .tile { transform: translateY(-1px) rotate(-6deg); }
.nav .it .ic-spark .s2 { transform-origin: center; transition: transform var(--sp-pop-d) var(--sp-pop); }
.nav .it:hover .ic-spark .s2 { transform: rotate(90deg) scale(1.3); }

.main { position: relative; overflow: hidden; }
.main::before { content: ""; position: absolute; inset: 0; background: var(--halo); pointer-events: none; }
.page { position: absolute; inset: 0; padding: 26px 30px; transform-origin: 50% 0; }
.page.out { animation: page-out 160ms var(--ease-in) both; pointer-events: none; z-index: 0; }
.page.out ~ .page .ent.in { transition-delay: calc(90ms + var(--i, 0) * 40ms); }
@keyframes page-out { to { opacity: 0; transform: scale(.985) translateY(-4px); filter: blur(2px); } }
.ent { opacity: 0; transform: translateY(10px) scale(.99); }
.ent.in { opacity: 1; transform: none; transition: opacity 260ms var(--ease-out), transform var(--sp-settle-d) var(--sp-settle); transition-delay: calc(var(--i, 0) * 40ms); }
.ph { display: flex; align-items: center; gap: 14px; }
.ph .apptile { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(160deg, #3fcf86 0%, #0f8a4b 100%); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.25), 0 6px 14px -6px rgba(15,138,75,.6); }
.ph .apptile.blue { background: linear-gradient(160deg, #58a6ff, #1d5fd1); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.25), 0 6px 14px -6px rgba(29,95,209,.6); }
.ph .apptile svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.ph h1 { margin: 0; font-size: 24px; font-weight: 680; letter-spacing: -.025em; line-height: 1.1; }
.ph .meta { font-size: 13px; color: var(--text3); margin-top: 3px; }
.ph .acts { margin-left: auto; display: flex; gap: 8px; }
.grid { display: grid; grid-template-columns: 1fr 290px; gap: 14px; margin-top: 18px; }
.col { display: flex; flex-direction: column; gap: 12px; }

/* hero */
.hero { padding: 18px 20px 14px; overflow: hidden; }
.hero .top { display: flex; align-items: flex-start; }
.lbl { font-size: 12.5px; color: var(--text3); font-weight: 520; }

.delta { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--text3); }
.pill { display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 7px; border-radius: 99px; font-size: 12px; font-weight: 620; background: var(--gain-soft); color: var(--gain-text); }
.pill svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.gain { color: var(--gain-text); font-weight: 600; }
.chart { position: relative; height: 200px; margin: 14px -4px 0; cursor: crosshair; }
.chart svg { position: absolute; top: 0; left: 0; right: 56px; height: 100%; width: calc(100% - 56px); overflow: visible; }
.chart .xls { position: absolute; left: 0; right: 0; bottom: 0; }
.chart .line { fill: none; stroke: var(--chart-line); stroke-width: 1.75; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.chart .area { stroke: none; }
.chart .grid-l { stroke: var(--chart-grid); stroke-width: 1; vector-effect: non-scaling-stroke; }
.chart .base { stroke: var(--text4); stroke-width: 1; stroke-dasharray: 2 4; vector-effect: non-scaling-stroke; opacity: .6; }
.chart .ax { position: absolute; right: 0; width: 48px; text-align: left; font-size: 11px; color: var(--text4); transform: translateY(-50%); transition: opacity 200ms; }
.chart .xl { position: absolute; bottom: -22px; white-space: nowrap; font-size: 11px; color: var(--text4); transform: translateX(-50%); }
.chart .pen { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 99px; background: var(--chart-line); left: 0; top: 0;
  box-shadow: 0 0 0 3px var(--canvas), 0 0 12px 2px var(--ring-soft); transform: translate(var(--x), var(--y)); will-change: transform; }
.chart .pen::after { content: ""; position: absolute; inset: -6px; border-radius: 99px; border: 1.5px solid var(--chart-line); opacity: 0; }
.chart .pen.live::after { animation: ping 2.2s var(--ease-out) infinite 600ms; }

<script>/* EMP · Kinetic precision — prototype runtime (vanilla, no deps). */
(() => {
"use strict";
const Q = new URLSearchParams(location.search);
const STATIC = Q.has("static");               // skip entrance animations (screenshots of resting states)
const html = document.documentElement;
if (Q.has("rm")) html.classList.add("rm");
if (Q.has("fx")) html.classList.add("fx-reduced");
const reduced = () => html.classList.contains("rm") || matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ═══════════════ 1. Springs: one definition → JS integrator + CSS linear() ═══════════════ */
const SPRINGS = {
  tap:    { k: 700, c: 30, m: 0.6 },   // press release, toggles, icon nudges
  glide:  { k: 420, c: 34, m: 1 },     // indicators, selection pills, menus
  settle: { k: 260, c: 28, m: 1 },     // dialogs, sheets, cards entering
  morph:  { k: 380, c: 36, m: 1 },     // shared-element (card → detail)
  pop:    { k: 520, c: 20, m: 1 },     // success: checkbox fill, goal ring, switch thumb
  magnet: { k: 240, c: 16, m: 0.8 },   // magnetic follow, tilt
  roll:   { k: 200, c: 24, m: 1 },     // odometer digits
  switch: { k: 600, c: 28, m: 0.8 },

  let x = 0, v = 0, t = 0; const dt = 1 / 600, pts = [[0, 0]];
  while (t < 3) { const a = (-k * (x - 1) - c * v) / m; v += a * dt; x += v * dt; t += dt; pts.push([t, x]); if (Math.abs(x - 1) < 0.0015 && Math.abs(v) < 0.02) break; }

  out[N] = 1;
  return { css: `linear(${out.join(",")})`, ms: Math.round(t * 1000) };

const LIN = {};
for (const [n, s] of Object.entries(SPRINGS)) { LIN[n] = springToLinear(s); html.style.setProperty(`--sp-${n}`, LIN[n].css); html.style.setProperty(`--sp-${n}-d`, LIN[n].ms + "ms"); }

const active = new Set(); let last = 0, raf = 0;
function loop(ts) {

}

  constructor(v, cfg, on) { this.v = v; this.to = v; this.vel = 0; this.cfg = SPRINGS[cfg] || cfg; this.on = on; }
  set(to, immediate) {

/* ═══════════════ 2. Icons ═══════════════ */

const I = {

function wireMagnet(root) {

      b.addEventListener("pointerleave", () => { b._mx.set(0); b._my.set(0); }); }
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);

function wireTilt(root) {

    c.style.setProperty("--px", `${px * 100}%`); c.style.setProperty("--py", `${py * 100}%`);

    if (!c._rx) { c._rx = new Spring(0, "magnet", (v) => c.style.setProperty("--rx", v.toFixed(2) + "deg")); c._ry = new Spring(0, "magnet", (v) => c.style.setProperty("--ry", v.toFixed(2) + "deg")); c._l = new Spring(0, "glide", (v) => c.style.setProperty("--lift", v.toFixed(2) + "px"));
      c.addEventListener("pointerleave", () => { c._rx.set(0); c._ry.set(0); c._l.set(0); }); }

function wireTabs(tabs) {

/* confetti-lite: isometric slabs with gravity; transform/opacity only; skipped under reduced motion/effects */
function confetti(host, x, y, n = 22) {
  if (reduced() || html.classList.contains("fx-reduced")) return;
  const parts = []; for (let i = 0; i < n; i++) {
    const d = document.createElement("div"); d.innerHTML = slabGlyph("", i); const el = d.firstElementChild; host.appendChild(el);
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.9; const sp = 260 + Math.random() * 260;
    parts.push({ el, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: (Math.random() - 0.5) * 40, vr: (Math.random() - 0.5) * 360, s: 0.8 + Math.random() * 0.7 });
  }

function flipOpen(panel, originEl, layer, { close = false } = {}) {

  P.querySelectorAll(".controls .tabs").forEach((t) => wireTabs(t));
  P.querySelectorAll(".live-select").forEach(wireSelect);
  const ts = P.querySelector(".theme-seg"); if (ts) wireSeg(ts, (t) => P.setAttribute("data-theme", t.toLowerCase()));
  P.querySelectorAll(".palette .res").forEach((r) => { const first = r.querySelectorAll(".r")[1] || r.querySelector(".r"); if (first && r.closest(".stage")) { first.classList.add("on"); r.querySelector(".hlr").style.setProperty("--y", first.offsetTop + "px"); } });

  // sidebar: selection pill (glide + vertical stretch with velocity), lagging hover ghost
  const sy = new Spring(0, "glide", (v, vel) => { sel.style.setProperty("--y", v + "px"); sel.style.setProperty("--sq", (1 + Math.min(Math.abs(vel) / 9000, 0.1)).toFixed(3)); });
  const gy = new Spring(0, { k: 300, c: 30, m: 1 }, (v) => ghost.style.setProperty("--y", v + "px"));
  const items = [...nav.querySelectorAll(".it")];
  let gshown = false;
  items.forEach((it) => it.addEventListener("pointerenter", () => { gy.set(it.offsetTop, !gshown); gshown = true; ghost.style.opacity = it.getAttribute("aria-current") ? 0 : 1; }));
  nav.addEventListener("pointerleave", () => { ghost.style.opacity = 0; gshown = false; });
  const current = () => items.find((i) => i.getAttribute("aria-current"));
  requestAnimationFrame(() => sy.set(current().offsetTop, true));

  // pages with depth transitions
  let pageCtl = null;
  function mount(kind, first) {
    const old = main.querySelector(".page");
    const go = () => {
      if (old && !go.keepOld) old.remove();
      main.insertAdjacentHTML("beforeend", kind === "home" ? homePage() : moneyPage(kind));
      const pg = main.querySelector(".page:not(.out)"); pageCtl = setupPage(pg, kind);
      const ents = pg.querySelectorAll(".ent");
      if (STATIC || reduced()) ents.forEach((e) => e.classList.add("in"));
      else { pg.getBoundingClientRect(); requestAnimationFrame(() => ents.forEach((e) => e.classList.add("in"))); }
    };
    if (old && !first && !reduced()) { old.classList.add("out"); old.removeAttribute("data-page"); const o = old; setTimeout(() => o.remove(), 170); go.keepOld = true; go(); } else go();
  }
  function navigate(it) {
    if (!it || it.hasAttribute("data-palette")) return;
    items.forEach((x) => x.removeAttribute("aria-current")); it.setAttribute("aria-current", "page"); ghost.style.opacity = 0; sy.set(it.offsetTop);
    mount(it.dataset.go);
  }
  items.forEach((it) => it.addEventListener("click", () => it.hasAttribute("data-palette") ? openPalette(it) : navigate(it)));

  function setupPage(pg, kind) {
    pg.querySelectorAll(".tabs").forEach(wireTabs);
    if (kind === "home") { pg.querySelectorAll(".hk").forEach((e) => odo(e, +e.dataset.v, String)); return {}; }
    const D = RANGES[kind];
    const nw = odo(pg.querySelector(".nw"), D.end);
    const pctEl = odo(pg.querySelector(".pct"), 0, (n) => `+${n.toFixed(1)}%`), dvEl = odo(pg.querySelector(".dv"), 0, (n) => `+$${money(n)}`);
    const setDelta = (R) => { const s = D[R][0]; pctEl.set(((D.end - s) / s) * 100); dvEl.set(D.end - s); };
    const ch = chart(pg.querySelector(".chart"), { values: D["1Y"], range: "1Y" }, { onScrub: (v) => nw.set(v, { fast: true }), onLeave: () => nw.set(D.end) });
    setTimeout(() => { ch.reveal(); setDelta("1Y"); }, STATIC ? 0 : 160);
    wireSeg(pg.querySelector(".seg.range"), (R) => { ch.morph(D[R], R); setDelta(R); });
    {
      const P = kind === "money";
      const tba = odo(pg.querySelector(".tba"), P ? 307.42 : 1284.17, (n) => money(n, 2));
      const sr = odo(pg.querySelector(".sr"), P ? 34.4 : 13.9, (n) => n.toFixed(1));
      const ef = odo(pg.querySelector(".ef"), P ? 4.7 : 7.4, (n) => n.toFixed(1));
      const ring = pg.querySelector(".ringv .pr"); setTimeout(() => ring.style.setProperty("--off", 1 - 4.7 / 6), STATIC ? 0 : 300);
      if (STATIC) ring.style.transition = "none";
      setTimeout(() => pg.querySelectorAll(".spark path").forEach((p) => p.classList.add("drawn")), 50);
      pg.querySelector(".assign").addEventListener("click", (e) => successMorph(e.currentTarget, () => { tba.set(0); toast("$307.42 assigned", "Groceries +$120 · Travel +$187.42"); }));
      pg.querySelector(".topup").addEventListener("click", () => {
        const gw = pg.querySelector(".goalwrap"); if (gw.classList.contains("reached")) return;
        ring.style.setProperty("--off", 0); ef.set(6.0); const sub = gwSub(pg); sub.animate([{ opacity: 1 }, { opacity: 0 }, { opacity: 1 }], { duration: 360 }); setTimeout(() => (sub.textContent = "Fully funded · 6 of 6 months"), 180);
        setTimeout(() => { gw.classList.add("reached"); const r = gw.getBoundingClientRect(), h = win.getBoundingClientRect(); confetti(confHost, r.left - h.left + 24, r.top - h.top + 24); toast("Goal reached", "Emergency fund · 6 months covered"); }, reduced() ? 0 : 650);
      });
      pg.querySelector("[data-open-dialog]").addEventListener("click", (e) => openDialog(e.currentTarget));
      pg.querySelector("[data-detail]").addEventListener("click", (e) => openDetail(e.currentTarget));
      return { nw, bump: (d) => nw.set(D.end + d) };
    }
  }

  // dialog from origin
  const dl = win.querySelector(".dlg-layer"), dlg = dl.querySelector(".dialog"); let dOrigin = null;
  function openDialog(origin) { dOrigin = origin; dl.classList.add("open"); flipOpen(dlg, origin, dl); setTimeout(() => dlg.querySelector("[data-confirm]").focus({ preventScroll: true }), 60); }
  function closeDialog() { if (!dl.classList.contains("open")) return; flipOpen(dlg, dOrigin, dl, { close: true }); dl.classList.remove("open"); }
  dl.querySelector(".scrim").addEventListener("click", closeDialog);
  dl.querySelector("[data-close]").addEventListener("click", closeDialog);
  dl.querySelector("[data-confirm]").addEventListener("click", () => { closeDialog(); setTimeout(() => { toast("48 transactions imported", "12 need a category"); pageCtl && pageCtl.bump && pageCtl.bump(1204); }, 180); });

  // command palette from the Search row
  const pl = win.querySelector(".pal-layer"), pal = pl.querySelector(".palette"), inp = pal.querySelector("input"), res = pal.querySelector(".res");
  let pOrigin = null, hi = 0; const hly = new Spring(0, "glide", (v) => res.querySelector(".hlr").style.setProperty("--y", v + "px"));
  const rows = () => [...res.querySelectorAll(".r")];
  function hl(i, imm) { const rs = rows(); if (!rs.length) return; hi = (i + rs.length) % rs.length; rs.forEach((r, k) => r.classList.toggle("on", k === hi)); hly.set(rs[hi].offsetTop, imm); }
  function render() { res.innerHTML = `<span class="hlr"></span>${paletteHTML(inp.value)}`; rows().forEach((r, k) => r.addEventListener("pointerenter", () => hl(k))); rows().forEach((r) => r.addEventListener("click", () => pick(r))); hl(0, true); }
  function pick(r) { const t = r.dataset.t; closePalette(); const target = items.find((i) => i.textContent.trim().startsWith(t === "Net worth report" ? "Money HQ" : t)); if (target) setTimeout(() => navigate(target), 120); else if (t === "Import transactions") setTimeout(() => openDialog(current()), 160); }
  function openPalette(origin) { pOrigin = origin; inp.value = ""; render(); pl.classList.add("open"); flipOpen(pal, origin, pl); setTimeout(() => inp.focus({ preventScroll: true }), 30); }
  function closePalette() { if (!pl.classList.contains("open")) return; flipOpen(pal, pOrigin, pl, { close: true }); pl.classList.remove("open"); }
  inp.addEventListener("input", render);
  inp.addEventListener("keydown", (e) => { if (e.key === "ArrowDown") { e.preventDefault(); hl(hi + 1); } else if (e.key === "ArrowUp") { e.preventDefault(); hl(hi - 1); } else if (e.key === "Enter") { const r = rows()[hi]; if (r) pick(r); } });
  pl.querySelector(".scrim").addEventListener("click", closePalette);
  P.addEventListener("keydown", (e) => { if (e.key === "Escape") { closePalette(); closeDialog(); closeDetail(); } });
  P._openPalette = () => openPalette(nav.querySelector("[data-palette]"));
  P._openDialog = () => openDialog(main.querySelector("[data-open-dialog]"));
  P._toast = toast; P._navigate = (label) => navigate(items.find((i) => i.textContent.trim() === label));

  // shared element: KPI card → detail (container FLIP + number flies with it)
  let det = null, detOrigin = null;
  function openDetail(card) {
    if (det) return; detOrigin = card; const mr = main.getBoundingClientRect(), cr = card.getBoundingClientRect();
    det = document.createElement("div"); det.className = "plate detail";
    const months = ["Jun", "Jul", "Aug", "Sep", "Oct", "Nov"], vals = [.42, .55, .38, .61, .72, .86];
    det.innerHTML = `<div class="dc"><div style="display:flex;align-items:center"><div><div class="lbl">Savings rate · 3 months</div><div class="dbig num">34.4%</div><div class="delta"><span class="pill">${I.up}+6.1 pts</span><span>vs prior 3 months</span></div></div><span style="margin-left:auto">${IB("secondary", "x", "det-close", "Close")}</span></div>
      <div class="bars">${vals.map((v, i) => `<i class="${i === 5 ? "cur" : ""}" style="--h:${v};--i:${i}"></i>`).join("")}</div><div class="bl">${months.map((m) => `<span>${m}</span>`).join("")}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px">${[["Income", "$8,940"], ["Spent", "$5,865"], ["Saved", "$3,075"]].map(([a, b], i) => `<div class="plate kpi"><div class="lbl">${a}</div><div class="v num" style="font-size:22px">${b}</div></div>`).join("")}</div></div>`;
    const pad = 18; Object.assign(det.style, { left: pad + "px", top: pad + "px", width: mr.width - pad * 2 + "px", height: mr.height - pad * 2 + "px" });
    main.appendChild(det); card.style.opacity = 0;
    const fl = [fly(card.querySelector(".lbl"), det.querySelector(".dc .lbl"), main), fly(card.querySelector(".v"), det.querySelector(".dbig"), main)];
    const tr = det.getBoundingClientRect(); const from = `translate(${cr.left - tr.left}px,${cr.top - tr.top}px) scale(${cr.width / tr.width},${cr.height / tr.height})`;
    if (!reduced()) {
      sync([...fl, det.animate([{ transform: from }, { transform: "none" }], { duration: LIN.morph.ms, easing: LIN.morph.css, fill: "both" }),
        main.querySelector(".page:not(.out)").animate([{ opacity: 1, transform: "none" }, { opacity: .22, transform: "scale(.97)" }], { duration: 300, easing: "cubic-bezier(.2,0,0,1)", fill: "both" })]);
    }
    requestAnimationFrame(() => det.classList.add("open"));
    det.querySelector(".det-close").addEventListener("click", closeDetail);
  }
  /* layoutId-style flight: a clone travels from src to dst (translate + uniform scale), dst is revealed on landing */
  function fly(src, dst, host, back) {
    if (reduced() || !src || !dst) return;
    const h = host.getBoundingClientRect(), a = src.getBoundingClientRect(), b = dst.getBoundingClientRect();
    const c = src.cloneNode(true); c.classList.add("flyer");
    Object.assign(c.style, { position: "absolute", left: a.left - h.left + "px", top: a.top - h.top + "px", width: a.width + "px", margin: 0, zIndex: 40, transformOrigin: "0 0", pointerEvents: "none" });
    const cs = getComputedStyle(src); for (const k of ["fontSize", "fontWeight", "letterSpacing", "lineHeight", "color", "display", "alignItems", "fontFamily"]) c.style[k] = cs[k];
    host.appendChild(c); dst.style.visibility = "hidden"; src.style.visibility = "hidden";
    const k = b.height / a.height;
    const an = c.animate([{ transform: "none" }, { transform: `translate(${b.left - a.left}px, ${b.top - a.top}px) scale(${k})` }], { duration: back ? 300 : LIN.morph.ms, easing: back ? LIN.morph.css : LIN.morph.css, fill: "both" });
    an.onfinish = () => { dst.style.visibility = ""; src.style.visibility = ""; c.remove(); };
    return an;
  }
  /* lock a set of WAAPI animations to one start time so container + flyers + backdrop move as one */
  const sync = (anims) => { const st = document.timeline.currentTime; anims.filter(Boolean).forEach((a) => (a.startTime = st)); };
  function closeDetail() {
    if (!det) return; const d = det; det = null; d.classList.remove("open");
    const cr = detOrigin.getBoundingClientRect(), tr = d.getBoundingClientRect();
    const to = `translate(${cr.left - tr.left}px,${cr.top - tr.top}px) scale(${cr.width / tr.width},${cr.height / tr.height})`;
    const pg = main.querySelector(".page:not(.out)");
    if (reduced()) { d.remove(); detOrigin.style.opacity = ""; pg.getAnimations().forEach((a) => a.cancel()); return; }
    pg.getAnimations().forEach((a) => a.reverse());
    const fl = [fly(d.querySelector(".dbig"), detOrigin.querySelector(".v"), main, true), fly(d.querySelector(".dc .lbl"), detOrigin.querySelector(".lbl"), main, true)];
    const dA = d.animate([{ transform: "none" }, { transform: to }], { duration: 300, easing: LIN.morph.css, fill: "both" }); fl.push(dA); sync(fl); dA.onfinish = () => { d.remove(); detOrigin.style.opacity = ""; };
  }

  // specimen interactions
  const kd = odo(P.querySelector(".kpi-demo"), 8, String); let kv = 8; P.querySelector(".roll-demo").addEventListener("click", () => kd.set(++kv));
  P.querySelector(".succ-demo").addEventListener("click", (e) => successMorph(e.currentTarget));
  P.querySelector(".savebtn").addEventListener("click", (e) => successMorph(e.currentTarget));
  P.querySelector(".conf-demo").addEventListener("click", (e) => { const b = e.currentTarget.getBoundingClientRect(); const host = document.createElement("div"); host.className = "confetti"; host.style.position = "fixed"; document.body.appendChild(host); confetti(host, b.left + b.width / 2, b.top + 4, 22); setTimeout(() => host.remove(), 1300); });
  const li = P.querySelector(".live-invalid"); li.querySelector("input").addEventListener("keydown", (e) => { if (e.key === "Enter") { li.classList.remove("shake"); void li.offsetWidth; li.classList.add("shake"); } });

  mount("money", true);
}

/* success morph styles (label lifts out, check draws in) */
const st = document.createElement("style");
st.textContent = `.btn .face .okk{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:translateY(8px) scale(.8);transition:opacity 120ms,transform var(--sp-pop-d) var(--sp-pop)}
.btn .face .okk svg{width:17px;height:17px;stroke-width:2.6;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 260ms cubic-bezier(.65,0,.35,1) 80ms}
.btn .face>svg,.btn .face>.txt{transition:opacity 120ms,transform var(--sp-tap-d) var(--sp-tap)}
.btn.success .face>svg,.btn.success .face>.txt{opacity:0;transform:translateY(-8px) scale(.9)}
.btn.success .face .okk{opacity:1;transform:none}.btn.success .face .okk svg{stroke-dashoffset:0}`;
document.head.appendChild(st);

/* ═══════════════ 8. Boot ═══════════════ */
const themes = (Q.get("themes") || "dark,light").split(",");
const app = document.getElementById("app");
app.innerHTML = themes.map(panelHTML).join("");
document.querySelectorAll(".panel").forEach(initPanel);
if (Q.get("theme0")) document.querySelector(".panel").setAttribute("data-theme", Q.get("theme0"));
document.getElementById("rm").addEventListener("change", (e) => html.classList.toggle("rm", e.target.checked));
document.getElementById("fx").addEventListener("change", (e) => html.classList.toggle("fx-reduced", e.target.checked));
document.getElementById("rm").checked = html.classList.contains("rm"); document.getElementById("fx").checked = html.classList.contains("fx-reduced");
document.getElementById("replay").addEventListener("click", () => document.querySelectorAll(".panel").forEach((p) => p._navigate("Money HQ")));
addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); document.querySelector(".panel")._openPalette(); } });
window.__kin = { panels: () => [...document.querySelectorAll(".panel")] };
})();
</script>
</body></html>
