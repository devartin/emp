[package]
name = "emp-store"
description = "EMP storage: SQLite vault with envelope encryption, integrity manifest, repositories, doc indexing, in-memory search, versions, assets, snapshots and backups"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
parking_lot.workspace = true
zeroize.workspace = true
base64.workspace = true
emp-crypto.workspace = true
emp-sheets.workspace = true
rusqlite = { version = "0.43", features = ["bundled", "serde_json", "functions", "limits"] }
crossbeam-channel = "0.5"
zstd = { version = "0.13", default-features = false }
ciborium = "0.2"
nucleo-matcher = "0.3"
unicode-segmentation = "1"
unicode-normalization = "0.1"
getrandom = "0.2"
hex = "0.4"

# Data layer (databases, imports, recurrence): SPEC §0.2 item 5, §8, §15.8, §17.4–17.5.
rrule = "0.14"
chrono-tz = "0.10"
csv = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
rust_decimal = "1"
pulldown-cmark = { version = "0.13", default-features = false }
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }

[dev-dependencies]
tempfile = "3"
# Tiny Argon2 parameters (`KdfParams::INSECURE_TEST`) for the test suite only; never enabled in normal builds.
emp-crypto = { path = "../emp-crypto", features = ["insecure-test-kdf"] }
