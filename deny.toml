# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# CI runs: cargo deny check advisories bans sources
# Locally, `cargo deny check` also runs the license check.

[graph]
# Evaluate every platform the desktop app ships on.
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Unmaintained / unsound / yanked are reported; vulnerabilities always fail.
yanked = "warn"
ignore = [
    # chrono / chrono-tz were declared unmaintained (chronotope/chrono#1768). These are "unmaintained"
    # notices, not vulnerabilities: no patched release exists and no known flaw affects EMP. chrono is used
    # pervasively (workspace crates, rrule, rusqlite, calamine, rust_xlsxwriter); migrating to jiff is a
    # separate, tracked piece of work. Remove these entries once that migration lands.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained (informational, no vulnerability); jiff migration tracked separately" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained (informational, no vulnerability); pulled with chrono via rrule; jiff migration tracked separately" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
]
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are not wildcards.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
