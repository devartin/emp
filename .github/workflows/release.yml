name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal)
            platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux (x64)
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: Windows (x64)
            platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # rust-toolchain.toml pins the compiler, and cargo uses that pin rather than whatever toolchain an action
      # installs, so the extra macOS targets must be added to the pinned toolchain itself.
      - name: Install the pinned toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          # Windows runners check out with core.autocrlf=true: drop the CR so the channel name is exact.
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml | tr -d '\r')"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          targets="${{ matrix.rust_targets }}"
          if [ -n "$targets" ]; then
            rustup target add --toolchain "$channel" ${targets//,/ }
          fi
          rustc --version

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A tag push creates a draft release and uploads every platform's installers to it; publish the draft
          # once all three builds have attached their files. A manual run (workflow_dispatch) is a build-only
          # dry run: with no tag name, nothing is uploaded.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Ultra Note ${{ github.ref_name }}"
          releaseBody: "See [CHANGELOG.md](https://github.com/devartin/ultra-note/blob/main/CHANGELOG.md) for what's new. Download the installer for your platform below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Keep the dry run's installers so they can be tried before tagging.
      - name: Upload installers (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*-setup.exe
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
          if-no-files-found: warn
          retention-days: 7
